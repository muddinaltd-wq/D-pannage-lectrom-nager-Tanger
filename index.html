:root{--b:#2563eb;--g:#25d366;--bg:#fafafa;--c:#fff;--t:#0f172a;--m:#64748b;--l:#e2e8f0;--gl:rgba(255,255,255,.8)}

*{box-sizing:border-box}
body{margin:0;font:16px/1.6 Inter,"Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--t)}
a{color:inherit;text-decoration:none}
.w{max-width:1120px;margin:auto;padding:0 20px}
section{padding:72px 0}
h1,h2,h3{line-height:1.2;letter-spacing:-.02em;margin:0 0 12px}
h1{font-size:clamp(2rem,5vw,3.4rem)}h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}
.m{color:var(--m)}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:20px;transition:translate .3s,box-shadow .3s}
.card:hover{translate:0 -4px;box-shadow:0 12px 30px rgba(0,0,0,.1)}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;background:var(--b);color:#fff;transition:all .3s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.wa{background:var(--g)}.ghost{background:transparent;color:var(--t);border:1px solid var(--l)}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(16,185,129,.12);color:#059669}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:#10b981;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(37,99,235,.1);color:var(--b)}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:var(--gl);border-bottom:1px solid var(--l)}
.hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px}
.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:18px}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#60a5fa)}
.logo b{display:block;animation:w 3s ease-in-out infinite}
@keyframes w{50%{transform:rotate(-25deg)}}
nav{display:flex;gap:20px;margin-inline:auto;font-size:14px;font-weight:500}
nav a{position:relative;padding:4px 0;white-space:nowrap}
nav a:after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;background:var(--b);transform:scaleX(0);transition:.3s}
nav a:hover:after{transform:scaleX(1)}
.hr{display:flex;gap:10px;align-items:center}
@media(max-width:900px){nav{order:3;width:100%;overflow-x:auto;margin:0}.ph{display:none}.hd{justify-content:space-between}}
.hero{padding-top:56px;text-align:center}
.qb{max-width:760px;margin:28px auto 0;text-align:start;backdrop-filter:blur(12px);background:var(--gl)}
.qb:hover{translate:none}
.dev{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:10px 0 16px}
.dv{border:1px solid var(--l);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;background:var(--c);color:inherit;font-family:inherit;font-size:13px;transition:border-color .3s,background .3s}
.dv span{display:block;font-size:24px}
.dv.on{border-color:var(--b);background:rgba(37,99,235,.1)}
select,input,textarea{width:100%;padding:11px 12px;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
.bd{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.bd span{font-size:13px;border:1px solid var(--l);border-radius:99px;padding:6px 12px;background:var(--c)}
.bn{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:28px}
.bn .card{grid-column:span 2}.bn .card:nth-child(-n+2){grid-column:span 3}
@media(max-width:800px){.bn .card,.bn .card:nth-child(n){grid-column:span 6}}
.ic{font-size:30px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
ul.ck{list-style:none;padding:0;margin:12px 0;color:var(--m);font-size:14px}
ul.ck li:before{content:"✓ ";color:#10b981;font-weight:700}
.bk{max-width:720px;margin:28px auto 0}.bk:hover{translate:none;box-shadow:none}
.st{display:flex;gap:6px;margin-bottom:20px}
.st i{flex:1;height:5px;border-radius:9px;background:var(--l);transition:.3s}.st i.on{background:var(--b)}
.fs{display:none;gap:12px;grid-template-columns:1fr 1fr}.fs.on{display:grid}
.fs>.f{grid-column:span 2}.fs>.h{grid-column:span 1}
@media(max-width:600px){.fs{grid-template-columns:1fr}.fs>.f,.fs>.h{grid-column:auto}}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--l);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;background:var(--c);color:inherit;font-family:inherit}
.chip.on,.chip:hover{border-color:var(--b);background:rgba(37,99,235,.1)}
label.l{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--l);border-radius:12px;background:var(--c);flex-wrap:wrap;margin-top:12px}
.tabs button{padding:8px 14px;border:0;border-radius:8px;background:transparent;color:var(--t);cursor:pointer;font-family:inherit;font-weight:600}
.tabs button.on{background:var(--b);color:#fff}
.big{font-size:2.4rem;font-weight:800;color:var(--b);line-height:1.2}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:24px}
.stp{position:relative}
.stp .n{width:40px;height:40px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.stp:not(:last-child):after{content:"";position:absolute;top:40px;inset-inline-start:72px;inset-inline-end:-20px;height:2px;background:var(--l);transform:scaleX(var(--p,1));transform-origin:0 50%}
html[dir=rtl] .stp:after{transform-origin:100% 50%}
@media(max-width:700px){.stp:after{display:none}}
details{border:1px solid var(--l);border-radius:12px;background:var(--c);padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--b);font-size:20px;line-height:1}
details[open] summary:after{content:"–"}
details p{margin:10px 0 0}
#fw{position:fixed;inset-inline-end:20px;bottom:20px;z-index:60}
#fbtn{width:58px;height:58px;border-radius:50%;border:0;background:var(--g);cursor:pointer;font-size:26px;box-shadow:0 8px 24px rgba(37,211,102,.5)}
#fp{display:none;position:absolute;bottom:72px;inset-inline-end:0;width:min(330px,calc(100vw - 40px));background:var(--c);border:1px solid var(--l);border-radius:16px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.2)}
#fp.on{display:block}
.im{aspect-ratio:3/2;border-radius:12px;background:var(--l);overflow:hidden;margin-bottom:14px}
.im img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
img[src=""]{opacity:0}
header.sc{box-shadow:0 4px 20px rgba(0,0,0,.08)}
.req{width:100%;margin-top:4px;padding:13px 18px;border-radius:12px;font-weight:700;letter-spacing:.01em;background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 8px 20px rgba(37,211,102,.35)}

.req:after{content:"→";transition:translate .3s}
.req:hover:after{translate:5px 0}
html[dir=rtl] .req:after{content:"←"}

</head>

{ic:"🧊",img:"assets/fridge.webp",s:["Frigo","ثلاجة"],n:["Réfrigérateurs & congélateurs","الثلاجات والمجمدات"],i:[["Panne de froid","Recharge de gaz","Remplacement du compresseur"],["لا يبرّد","تعبئة الغاز","تغيير الضاغط"]]},
{ic:"🧺",img:"assets/washer.webp",s:["Lave-linge","غسالة"],n:["Lave-linge & sèche-linge","الغسالات والمجففات"],i:[["Alignement du tambour","Réparation du moteur","Vidange / électrovanne"],["ضبط الأسطوانة","إصلاح المحرك","التصريف وصمام الماء"]]},
{ic:"❄️",img:"assets/ac.webp",s:["Clim","مكيف"],n:["Climatisation & HVAC","المكيفات والتكييف"],i:[["Entretien des filtres","Test de fuite de gaz","Lavage des serpentins · pose split"],["صيانة الفلاتر","فحص تسرب الغاز","غسيل الملف وتركيب سبليت"]]},
{ic:"🔥",img:"assets/oven.webp",s:["Four","فرن"],n:["Cuisinières & fours","المواقد والأفران"],i:[["Problèmes d'allumage","Calibrage du thermostat","Pose de plaque"],["مشاكل الإشعال","معايرة الثرموستات","تركيب الموقد"]]},
{ic:"🍽️",img:"assets/washer.webp",s:["Lave-vaisselle","غسالة صحون"],n:["Lave-vaisselle","غسالات الصحون"],i:[["Réparation de la pompe","Bras d'aspersion","Raccordement plomberie"],["إصلاح المضخة","تنظيف أذرع الرش","توصيل السباكة"]]},
{ic:"♨️",s:["Micro-ondes","ميكروويف"],n:["Micro-ondes","الميكروويف"]}];
const S_=[["Réparation d'urgence","إصلاح طارئ"],["Entretien programmé","صيانة دورية"],["Nouvelle installation","تركيب جديد"],["Diagnostic","فحص وتشخيص"]];
const C=[["Aucune alimentation","Bruit anormal","Fuite d'eau","Ne refroidit/chauffe pas"],["لا يعمل","صوت غريب","تسرب مياه","لا يبرّد/لا يسخّن"]];
const SL=[["Matin (8h–12h)","Après-midi (12h–17h)","Soir (17h–20h)"],["صباحاً (8–12)","بعد الظهر (12–17)","مساءً (17–20)"]];
/* Sample reviews: replace with your REAL customers' reviews.
   Add src:"google" to show the Google badge, and when:["il y a 2 ans","منذ سنتين"] to show the date. */
const RV=[
{n:"Sara M.",g:["Frigo en panne → refroidit","ثلاجة معطلة ← تبرّد"],t:["Technicien ponctuel, le prix annoncé a été respecté.","فني ملتزم بالموعد والسعر المتفق عليه."]},
{n:"Youssef B.",g:["Fuite d'eau → réparé","تسرب مياه ← تم الإصلاح"],t:["Lave-linge réparé en une visite, avec garantie.","تم إصلاح الغسالة في زيارة واحدة مع ضمان."]},
{n:"Nadia K.",g:["Clim neuve → posée","مكيف جديد ← تم تركيبه"],t:["Installation propre et rapide, explications claires.","تركيب نظيف وسريع مع شرح واضح."]}];

const mo=()=>window.gsap&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
let L=ls('fxl')||(navigator.language.startsWith('ar')?'ar':'fr'),step=0;
const S={dev:0,sv:0,br:0,sl:0,pr:0,ch:[]},$=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const l=()=>L=='ar'?1:0,get=p=>p.split('.').reduce((o,k)=>o&&o[k],T[L]);
const STAR='<svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>';
const GLOGO='<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.5h5.9c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7c2.2-2 3.2-5 3.2-8.4z"/><path fill="#34A853" d="M12 23c3 0 5.6-1 7.5-2.7l-3.7-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.9C4 20 7.8 23 12 23z"/><path fill="#FBBC05" d="M5.7 14c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V6.9H2C1.3 8.4 1 10.2 1 12s.3 3.6 1 5.1l3.7-3.1z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2 15 1 12 1 7.8 1 4 4 2 7.9l3.7 2.9c.9-2.6 3.4-4.4 6.3-4.4z"/></svg>';
const cur=()=>L=='ar'?'د.م.':'DH';
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const opts=(a,s)=>a.map((x,i)=>`<option value="${i}"${i==s?' selected':''}>${x}</option>`).join('');

/* WhatsApp deep link (fixed version of the spec's URL builder) */
const link=o=>{const m=T[L].m,v=x=>x||'—';
return `https://wa.me/${PHONE}?text=`+encodeURIComponent(
`${m[0]}\n\n${m[1]}\n• ${m[2]}: ${v(o.appliance)}\n• ${m[3]}: ${v(o.brand)}\n• ${m[4]}: ${v(o.serviceType)}\n• ${m[5]}: ${v(o.issue)}\n• ${m[6]}: ${v(o.date)}\n• ${m[7]}: ${v(o.address)}`+
(o.name?`\n• ${m[9]}: ${o.name} ${o.phone||''}`:'')+`\n\n${m[8]}`)};

function render(){
const i=l(),B=['Samsung','LG','Bosch','Whirlpool','GE',get('oth')];
document.documentElement.lang=L;document.documentElement.dir=i?'rtl':'ltr';
$$('[data-t]').forEach(e=>e.textContent=get(e.dataset.t));
$('#lg').textContent=i?'Français':'العربية';
$('#tel').textContent=PHD;$('#tel').href='tel:+'+PHONE;
$('#dev').innerHTML=D.map((d,j)=>`<button type="button" class="dv${j==S.dev?' on':''}" data-i="${j}"><span>${d.ic}</span>${d.s[i]}</button>`).join('');
$('#hs').innerHTML=$('#svc').innerHTML=opts(S_.map(x=>x[i]),S.sv);
$('#fa').innerHTML=opts(D.map(d=>d.s[i]),S.dev);
$('#fbr').innerHTML=opts(B,S.br);
$('#sl').innerHTML=opts(SL[i],S.sl);
$('#bd').innerHTML=get('bd').map(x=>`<span>${x}</span>`).join('');
$('#bn').innerHTML=D.map((d,j)=>d.i?`<div class="card"><div class="im"><img src="${d.img||''}" alt="${d.img?d.n[i]:''}" loading="lazy"></div><div class="row"><span class="ic">${d.ic}</span><span class="tag">${get('from')} <bdi>${FROM}</bdi> ${cur()}</span></div><h3 style="margin-top:10px">${d.n[i]}</h3><ul class="ck">${d.i[i].map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn req" data-req="${j}">💬 ${get('req')}</button></div>`:'').join('');
$('#chs').innerHTML=C[i].map((c,j)=>`<button type="button" class="chip${S.ch.includes(j)?' on':''}" data-c="${j}">${c}</button>`).join('');
$('#iss').placeholder=get('isph');
$('#hw').innerHTML=get('hw').map((x,j)=>`<div class="card stp"><div class="n">${j+1}</div><h3>${x[0]}</h3><p class="m">${x[1]}</p></div>`).join('');
$('#rv').innerHTML=RV.map(r=>`<article class="card review"><div class="review-head">${r.src=='google'?`<span class="google-tag">${GLOGO}Google</span>`:''}<span class="stars">${STAR.repeat(5)}</span></div><p>“${r.t[i]}”</p><div><span class="tag">${r.g[i]}</span></div><div class="reviewer"><div class="avatar">${r.n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div><div><b>${r.n}</b><small>${get('vf')}${r.when?' · '+r.when[i]:''}</small></div></div></article>`).join('');
$('#fq').innerHTML=get('fq').map(x=>`<details><summary>${x[0]}</summary><p class="m">${x[1]}</p></details>`).join('');
$('#qa').innerHTML=get('qa').map((x,j)=>`<button class="chip" data-wa="q${j}" style="text-align:start">${x}</button>`).join('');
price();if(step==3)summary();if(window.gsap)gsap.set('#pg',{transformOrigin:i?'100% 50%':'0 50%'})}

function price(){const x=get('pr'),p=x[S.pr];
$('#tb').innerHTML=x.map((q,j)=>`<button class="${j==S.pr?'on':''}" data-p="${j}">${q[0]}</button>`).join('');
$('#pc').innerHTML=`<div class="big"><bdi>${p[1]}</bdi> ${cur()}</div><p>${p[2]}</p><p class="m" style="margin:0">🔩 ${get('pp')}</p>`}

function sync(){$('#hs').value=$('#svc').value=S.sv;$('#fa').value=S.dev;$$('.dv').forEach(b=>b.classList.toggle('on',+b.dataset.i==S.dev))}

const order=()=>({appliance:D[S.dev].n[l()],brand:$('#fbr').selectedOptions[0].text,serviceType:S_[S.sv][l()],
issue:[...S.ch.map(c=>C[l()][c]),$('#iss').value.trim()].filter(Boolean).join(', '),
date:[$('#dt').value,SL[l()][S.sl]].filter(Boolean).join(' · '),address:$('#ad').value.trim(),name:$('#nm').value.trim(),phone:$('#tl').value.trim()});

function summary(){const o=order();
$('#sm').innerHTML=`<b>${esc(o.appliance)}</b> · ${esc(o.brand)}<br>${esc(o.serviceType)}${o.issue?' — '+esc(o.issue):''}<br>${esc(o.date)} · ${esc(o.name)} · ${esc(o.phone)}`}

function go(n){const p=step;step=n;$$('.fs').forEach((e,j)=>e.classList.toggle('on',j==n));$$('#st i').forEach((e,j)=>e.classList.toggle('on',j<=n));
$('#bk').style.visibility=n?'visible':'hidden';$('#nx').style.display=n==3?'none':'';if(n==3)summary();if(go.s&&n!=p&&mo())gsap.fromTo($$('.fs')[n],{x:l()?-24:24,autoAlpha:0},{x:0,autoAlpha:1,duration:.4,ease:'power2.out',clearProps:'transform'});go.s=1}

document.addEventListener('click',e=>{
const t=e.target.closest('[data-wa],[data-req],[data-i],[data-c],[data-p]');if(!t)return;const d=t.dataset;
if(d.wa){e.preventDefault();open(d.wa=='book'?link({}):`https://wa.me/${PHONE}?text=`+encodeURIComponent(get('qa.'+d.wa.slice(1))),'_blank')}
else if(d.req){open(link({appliance:D[d.req].n[l()]}),'_blank')}
else if(d.i){S.dev=+d.i;sync()}
else if(d.c){const c=+d.c,k=S.ch.indexOf(c);k<0?S.ch.push(c):S.ch.splice(k,1);t.classList.toggle('on')}
else if(d.p){S.pr=+d.p;price();if(mo())gsap.from('#pc > *',{y:12,autoAlpha:0,stagger:.08,duration:.4})}});

document.addEventListener('change',e=>{const k={hs:'sv',svc:'sv',fa:'dev',fbr:'br',sl:'sl'}[e.target.id];if(k){S[k]=+e.target.value;sync()}});

$('#lg').onclick=()=>{L=L=='ar'?'fr':'ar';ls('fxl',L);fxKill();render();plx()};
$('#hg').onclick=()=>open(link({appliance:D[S.dev].n[l()],serviceType:S_[S.sv][l()]}),'_blank');
$('#bk').onclick=()=>go(step-1);
$('#nx').onclick=()=>{if(step==2&&(!$('#nm').value.trim()||!$('#tl').value.trim())){alert(get('need'));return}go(step+1)};
$('#sa').onclick=()=>open(link(order()),'_blank');
$('#sb').onclick=()=>{const o=order();
try{const a=JSON.parse(ls('fxOrders')||'[]');a.push({...o,at:Date.now()});ls('fxOrders',JSON.stringify(a))}catch(x){}
if(ENDPOINT)fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).catch(()=>{});
$('#ok').textContent=get('done');open(link(o),'_blank')};
$('#fbtn').onclick=()=>{const o=$('#fp').classList.toggle('on');if(!mo())return;
if(o){pulse&&pulse.pause();gsap.to('#fbtn',{scale:1,duration:.2});
gsap.timeline().from('#fp',{y:16,scale:.95,autoAlpha:0,transformOrigin:l()?'0% 100%':'100% 100%',duration:.35})
.from('#qa .chip',{x:l()?12:-12,autoAlpha:0,stagger:.07,duration:.3},'<.1')}else pulse&&pulse.restart()};

$('#dt').min=new Date().toISOString().slice(0,10);
render();go(0);

/* ===== GSAP motion ===== */
let dyn=[],pulse;
const fxKill=()=>{dyn.forEach(t=>t.kill());dyn=[]};
function plx(){ // parallax on service images + connector lines (rebuilt after a language switch)
if(!mo())return;
gsap.utils.toArray('.im img').forEach(img=>dyn.push(gsap.fromTo(img,{yPercent:-8,scale:1.2},{yPercent:8,scale:1.2,ease:'none',scrollTrigger:{trigger:img.parentNode,scrub:true}}).scrollTrigger));
gsap.utils.toArray('.stp:not(:last-child)').forEach(el=>dyn.push(gsap.fromTo(el,{'--p':0},{'--p':1,ease:'none',scrollTrigger:{trigger:el,start:'top 80%',end:'top 40%',scrub:true}}).scrollTrigger))}
if(window.gsap&&window.ScrollTrigger){
gsap.registerPlugin(ScrollTrigger);window.ScrollToPlugin&&gsap.registerPlugin(ScrollToPlugin);
gsap.defaults({duration:.7,ease:'power3.out'});
const mm=gsap.matchMedia();
mm.add('(prefers-reduced-motion: no-preference)',()=>{
gsap.timeline()
.from('.hero h1',{y:30,autoAlpha:0})
.from('.hero h1 + p',{y:20,autoAlpha:0},'<.1')
.from('.qb',{y:30,autoAlpha:0},'<.15')
.from('.dv',{y:15,autoAlpha:0,duration:.4,stagger:.05},'<.2')
.from('.bd span',{scale:.8,autoAlpha:0,duration:.4,stagger:{each:.08,from:'center'},ease:'back.out(1.7)'},'-=.2');
const els=gsap.utils.toArray('.bn .card,.g3 .card,details');
gsap.set(els,{autoAlpha:0,y:40});
dyn.push(...ScrollTrigger.batch(els,{start:'top 88%',once:true,onEnter:b=>gsap.to(b,{autoAlpha:1,y:0,stagger:.12,overwrite:true,clearProps:'transform,opacity,visibility'})}));
ScrollTrigger.create({start:0,end:'max',onUpdate:s=>gsap.set('#pg',{scaleX:s.progress})});
ScrollTrigger.create({start:80,end:'max',onToggle:s=>$('header').classList.toggle('sc',s.isActive)});
pulse=gsap.to('#fbtn',{scale:1.08,duration:.9,yoyo:true,repeat:-1,ease:'sine.inOut'});
plx()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]'),id=a&&a.getAttribute('href');
if(!id||id.length<2||!window.ScrollToPlugin||!mo())return;const t=$(id);
if(t){e.preventDefault();gsap.to(window,{scrollTo:{y:t,offsetY:64},duration:.8,ease:'power3.inOut'})}})}
</script>
</body>
